<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Android MCP Viewer</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header>
      <div>
        <h1>Android MCP Viewer</h1>
        <p id="summary">Connecting…</p>
      </div>
      <div class="toolbar">
        <label><input id="live" type="checkbox"> Live · 1s</label>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </header>
    <main>
      <section class="screen-panel">
        <div id="stage" class="stage">
          <img id="screen" alt="Current Android screen">
          <svg id="overlay" aria-label="Semantic node overlay"></svg>
        </div>
      </section>
      <aside>
        <div class="filters">
          <label><input type="checkbox" data-source="accessibility" checked> Accessibility</label>
          <label><input type="checkbox" data-source="ocr" checked> OCR</label>
          <label><input type="checkbox" data-source="vision" checked> Vision</label>
          <label><input id="actionable" type="checkbox"> Actionable only</label>
        </div>
        <div id="notice" role="status"></div>
        <section id="detail" class="detail"><p>Click the screenshot to inspect an element.</p></section>
        <pre id="outline"></pre>
      </aside>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
